<!DOCTYPE html>
<!--
  Molde para generar public/img/icono-180.png (el icono que usan iOS y Android
  cuando alguien guarda la pagina en su pantalla de inicio).
  Se regenera con:  npm run og
-->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 180px; height: 180px; overflow: hidden; }
    svg { display: block; width: 180px; height: 180px; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6c5ce7"/>
        <stop offset="1" stop-color="#00d1b2"/>
      </linearGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="url(#marca)"/>
    <path fill="#ffffff" fill-rule="evenodd"
          d="M32 12 L49 52 H40.6 L37.4 44 H26.6 L23.4 52 H15 Z M28.8 38 H35.2 L32 27 Z"/>
  </svg>
</body>
</html>
