# ============================================================================
# PYPROJECT.TOML
# OBJETIVO: Archivo de configuración principal del proyecto para Poetry.
#           Define todas las dependencias, metadatos y configuración del 
#           entorno Python. Es el equivalente a requirements.txt pero más 
#           potente y moderno.
# ============================================================================

[tool.poetry]
name = "exogena-mvp"
version = "0.1.0"
description = "MVP para gestión de información exógena DIAN"
authors = ["Tu Nombre <tu.email@ejemplo.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"  # Especificar rango exacto
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
python-dotenv = "^1.0.0"
pydantic = "^2.0.0"
pandas = "^2.2.0"  # Versión 2.x que es estable con Python 3.13
python-multipart = "^0.0.6"
openpyxl = "^3.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"